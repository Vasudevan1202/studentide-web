<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <!-- Cap Top Gradient -->
    <linearGradient id="logoCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4befe" />
      <stop offset="50%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#7287fd" />
    </linearGradient>

    <!-- Bracket Gradients -->
    <linearGradient id="logoLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <linearGradient id="logoRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4befe" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <linearGradient id="logoSlashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Scaled down to 160x160 at x=20, y=20) -->
  <g transform="translate(20, 20) scale(0.15625)" filter="url(#logoShadow)">
    <!-- Base Squircle -->
    <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#logoBgGrad)" stroke="url(#logoBorderGrad)" stroke-width="14" />
    
    <!-- Cap Base -->
    <path d="M 370 330 L 370 395 C 370 455 654 455 654 395 L 654 330 Z" fill="#313244" />
    
    <!-- Cap Rhombus Top -->
    <path d="M 512 180 L 784 285 L 512 390 L 240 285 Z" fill="url(#logoCapGrad)" />
    <path d="M 512 180 L 784 285 L 512 300 L 240 285 Z" fill="#ffffff" opacity="0.25" />

    <!-- Tassel -->
    <circle cx="512" cy="285" r="20" fill="#ffffff" />
    <circle cx="512" cy="285" r="14" fill="#7287fd" />
    <path d="M 512 285 Q 670 295 730 350 Q 770 390 775 450" fill="none" stroke="#f9e2af" stroke-width="14" stroke-linecap="round" />
    <circle cx="775" cy="450" r="14" fill="#f9e2af" />
    <path d="M 765 455 L 755 520 L 795 520 L 785 455 Z" fill="#f9e2af" />

    <!-- Code Brackets -->
    <path d="M 400 500 L 290 600 L 400 700" fill="none" stroke="url(#logoLeftGrad)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 624 500 L 734 600 L 624 700" fill="none" stroke="url(#logoRightGrad)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 566 480 L 458 720" fill="none" stroke="url(#logoSlashGrad)" stroke-width="56" stroke-linecap="round" />
    <circle cx="512" cy="790" r="18" fill="#89dceb" />
  </g>

  <!-- Typography: Student IDE -->
  <g transform="translate(210, 0)">
    <text x="0" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Student <tspan fill="url(#textGrad)">IDE</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="4" y="152" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14" font-weight="600" fill="#a6adc8" letter-spacing="4">
      OFFLINE PROGRAMMING ENVIRONMENT
    </text>

    <!-- Version Pill Badge -->
    <g transform="translate(425, 68)">
      <rect x="0" y="0" width="56" height="24" rx="12" fill="#89b4fa" fill-opacity="0.15" stroke="#89b4fa" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="28" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#89b4fa" text-anchor="middle">V1.0</text>
    </g>
  </g>
</svg>
