<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#b4befe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Cap Top Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4befe" />
      <stop offset="50%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#7287fd" />
    </linearGradient>

    <!-- Cap Underside Gradient -->
    <linearGradient id="capDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#585b70" />
      <stop offset="100%" stop-color="#313244" />
    </linearGradient>

    <!-- Left Bracket Gradient -->
    <linearGradient id="leftBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- Right Bracket Gradient -->
    <linearGradient id="rightBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4befe" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <!-- Center Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="50%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="48" y="48" width="928" height="928" rx="220" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" filter="url(#dropShadow)" />

  <!-- Inner Ambient Glow Accent -->
  <circle cx="512" cy="480" r="320" fill="#89b4fa" opacity="0.06" filter="blur(60px)" />
  <circle cx="680" cy="620" r="240" fill="#cba6f7" opacity="0.05" filter="blur(60px)" />

  <!-- MAIN BRAND GLYPH GROUP -->
  <g id="brand-glyph" filter="url(#dropShadow)">
    <!-- Graduation Cap Skull Base -->
    <path d="M 370 330 L 370 395 C 370 455 654 455 654 395 L 654 330 Z" fill="url(#capDarkGrad)" opacity="0.95" />
    
    <!-- Graduation Cap Diamond Rhombus Top -->
    <path d="M 512 180 L 784 285 L 512 390 L 240 285 Z" fill="url(#capGrad)" />

    <!-- Cap Top Highlight Ridge -->
    <path d="M 512 180 L 784 285 L 512 300 L 240 285 Z" fill="#ffffff" opacity="0.18" />

    <!-- Tassel Center Button -->
    <circle cx="512" cy="285" r="20" fill="#ffffff" />
    <circle cx="512" cy="285" r="14" fill="#7287fd" />

    <!-- Tassel Ribbon & Hanging Fringe -->
    <path d="M 512 285 Q 670 295 730 350 Q 770 390 775 450" fill="none" stroke="#f9e2af" stroke-width="12" stroke-linecap="round" />
    <!-- Tassel Hanging Head & Bobble -->
    <circle cx="775" cy="450" r="14" fill="#f9e2af" />
    <path d="M 765 455 L 755 520 L 795 520 L 785 455 Z" fill="#f9e2af" />

    <!-- CODE SYMBOLS: Interlocking Brackets & Slash -->
    <!-- Left Bracket < -->
    <path d="M 400 500 L 290 600 L 400 700" 
          fill="none" 
          stroke="url(#leftBracketGrad)" 
          stroke-width="58" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 624 500 L 734 600 L 624 700" 
          fill="none" 
          stroke="url(#rightBracketGrad)" 
          stroke-width="58" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Slash / -->
    <path d="M 566 480 L 458 720" 
          fill="none" 
          stroke="url(#slashGrad)" 
          stroke-width="54" 
          stroke-linecap="round" />

    <!-- Core Terminal Dot / Star Accent -->
    <circle cx="512" cy="790" r="18" fill="#89dceb" />
  </g>
</svg>
